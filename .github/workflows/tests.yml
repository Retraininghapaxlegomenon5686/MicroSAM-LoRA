name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Only what the test suite actually imports (src/losses.py, src/models/lora.py,
        # src/data/dataset.py) — not the full requirements.txt (SimpleITK, transformers,
        # etc. aren't needed to run unit tests and would slow CI down for no reason).
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas opencv-python-headless scipy pytest

      - name: Run tests
        run: pytest tests/ -v
